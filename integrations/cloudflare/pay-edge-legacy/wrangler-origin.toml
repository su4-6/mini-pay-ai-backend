name = "origin-8443"
main = "origin-proxy-worker.js"
compatibility_date = "2026-08-09"

routes = [
  { pattern = "su46proj.site/*", zone_name = "su46proj.site" },
  { pattern = "www.su46proj.site/*", zone_name = "su46proj.site" },
]

[assets]
directory = "../main-site"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
