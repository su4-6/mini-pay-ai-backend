name = "minipay-pay-edge"
main = "origin-8443-worker.js"
compatibility_date = "2026-08-09"

routes = [
  { pattern = "pay.su46proj.site/*", zone_name = "su46proj.site" },
  { pattern = "callback.su46proj.site/*", zone_name = "su46proj.site" },
  { pattern = "food.su46proj.site", custom_domain = true },
]

# 这里原来有 R2 绑定用于从 minipay-downloads 桶分片下发 Android 安装包。
# Android 端已从线上下线（见前端仓库 android/RETIRED.md），
# 绑定与桶都不再使用；确认不再需要后可在 Cloudflare 控制台删除该桶。

[assets]
directory = "./web-assets-20260811-b-dc9d3929"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/login*",
  "/accounts*",
  "/orders*",
  "/backoffice*",
  "/audits*",
  "/security*",
  "/settings*",
  "/*.js",
  "/*.css",
  "/*.woff",
  "/*.woff2",
  "/*.ttf",
  "/*.svg",
  "/*.png",
  "/*.jpg",
  "/*.jpeg",
  "/*.webp",
  "/*.gif",
  "/*.ico",
  "/health",
  "/api/*",
  "/identity/*",
  "/oauth2/*",
  "/logout",
  "/switch-login*",
  "/payment*",
  "/wallet*",
  "/agent*",
  "/commerce*",
  "/admin-bff*",
  "/management*",
  "/callback*",
  "/__callback/*",
  "/merchant*",
  "/ops*",
  "/food*",
  "/_AMapService/*",
]
