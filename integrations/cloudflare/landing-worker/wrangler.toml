name = "minipay-web"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Static, self-contained HTML pages. No external assets.
workers_dev = false

# 只接管这三个主机名。其余子域（ops/merchant/admin/food/food-admin/identity/
# payment/wallet/commerce/agent）必须继续由 K3s 提供，Worker 内部对它们一律
# `return fetch(request)` 直通回源，绝不拦截。
# download.su46proj.site 不在这里 —— 它走 R2 自定义域名直连 bucket，
# 大文件不经过 Worker，更省事也更快（Worker 里的 R2 分支只是兜底）。
routes = [
  { pattern = "su46proj.site/*",     zone_name = "su46proj.site" },
  { pattern = "www.su46proj.site/*", zone_name = "su46proj.site" },
  { pattern = "pay.su46proj.site/*", zone_name = "su46proj.site" }
]

# Android APK downloads served from R2 (download.su46proj.site).
# R2_BUCKET: minipay-downloads -- object downloads/minipay-latest.apk (~39 MB),
# streamed to the client via object.body (never buffered in the Worker).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "minipay-downloads"
