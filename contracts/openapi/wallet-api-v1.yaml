openapi: 3.1.0
info:
  title: MiniPay Wallet API
  version: 1.3.0
  description: CNY sandbox wallet, activity bills, bank funding postings and TCC transfer branches.
paths:
  /api/v1/wallets/me:
    get:
      summary: Get the authenticated consumer wallet
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      responses:
        '200': {description: Wallet, content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/wallets/me/bills:
    get:
      summary: List the authenticated consumer activity bills
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/BusinessType'}
        - {name: source, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/BillStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Bill page, content: {application/json: {schema: {$ref: '#/components/schemas/BillsPage'}}}}
  /api/v1/wallets/me/bills/{billId}:
    get:
      summary: Get one consumer-owned activity bill
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      parameters:
        - name: billId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Bill detail, content: {application/json: {schema: {$ref: '#/components/schemas/BillDetail'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/wallets/me/collection-records:
    get:
      summary: List personal and merchant collection records with authoritative totals
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [ALL, PERSONAL, MERCHANT], default: ALL}}
        - {name: period, in: query, schema: {type: string, enum: [TODAY, MONTH], default: TODAY}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Collection record page, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionRecordPage'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/wallets/me/recent-transfer-counterparties:
    get:
      summary: List unique successful transfer counterparties ordered by most recent transfer
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: Recent transfer counterparties, content: {application/json: {schema: {$ref: '#/components/schemas/RecentTransferCounterpartyPage'}}}}
  /api/v1/wallets/me/transfer-records:
    get:
      summary: List transfer records with one counterparty and authoritative monthly totals
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: counterpartyUserId, in: query, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Direction'}
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {$ref: '#/components/parameters/BillStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Transfer record page, content: {application/json: {schema: {$ref: '#/components/schemas/TransferRecordPage'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/wallets/me/bills/{billId}/management:
    put:
      summary: Idempotently replace consumer-owned bill management metadata
      security: [{minipayOAuth: [wallet.write]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: billId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateBillManagement'}}}}
      responses:
        '200': {description: Updated detail, content: {application/json: {schema: {$ref: '#/components/schemas/BillDetail'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/wallets/me/bill-tags:
    get:
      summary: List current consumer bill tags
      security: [{minipayOAuth: [wallet.read]}]
      x-minipay-audience: consumer-api
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: Tag page, content: {application/json: {schema: {$ref: '#/components/schemas/BillTagPage'}}}}
    post:
      summary: Create an idempotent current-consumer bill tag
      security: [{minipayOAuth: [wallet.write]}]
      x-minipay-audience: consumer-api
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 12}}}}}
      responses:
        '201': {description: Created tag, content: {application/json: {schema: {$ref: '#/components/schemas/BillTag'}}}}
  /api/v1/management/wallet/accounts/{accountId}:
    get:
      summary: Read one wallet account for operations
      description: Read-only; no direct adjustment endpoint exists.
      security: [{minipayOAuth: [ops.portal]}]
      x-minipay-audience: management-api
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/OpsAccount'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/management/wallet/ledger-transactions:
    get:
      summary: Read balanced ledger transactions for operations
      security: [{minipayOAuth: [ops.portal]}]
      x-minipay-audience: management-api
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Ledger page, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerPage'}}}}
  /api/v1/management/wallet/ledger-transactions/{transactionId}:
    get:
      summary: Read one balanced ledger transaction and immutable entries
      security: [{minipayOAuth: [ops.portal]}]
      x-minipay-audience: management-api
      parameters:
        - {name: transactionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Ledger detail, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerDetail'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /internal/v1/wallet-accounts/resolve:
    post:
      summary: Resolve or provision a consumer wallet through the stable Wallet entry point
      security: [{minipayOAuth: [wallet.account.resolve]}]
      x-minipay-audience: wallet-internal
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResolveAccountRequest'}}}
      responses:
        '200': {description: Account routing, content: {application/json: {schema: {$ref: '#/components/schemas/ResolvedAccount'}}}}
  /internal/v1/wallet-postings/opening-grants:
    post:
      summary: Idempotently open a consumer wallet and post its initial sandbox grant
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OpeningGrantRequest'}}}
      responses:
        '200': {description: Existing result, content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}}
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}}
  /internal/v1/wallet-postings/recharges:
    post:
      summary: Idempotently credit a successful sandbox recharge
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RechargePostingRequest'}}}
      responses:
        '201': {description: Posted, content: {application/json: {schema: {$ref: '#/components/schemas/Bill'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /internal/v1/wallet-postings/withdrawals:
    post:
      summary: Debit a withdrawal into a PROCESSING bill and balanced ledger transaction
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalPostingRequest'}}}}
      responses:
        '201': {description: Posted, content: {application/json: {schema: {$ref: '#/components/schemas/Bill'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /internal/v1/wallet-postings/withdrawals/complete:
    post:
      summary: Mark a bank-confirmed withdrawal bill successful
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalCompletionRequest'}}}}
      responses:
        '200': {description: Completed, content: {application/json: {schema: {$ref: '#/components/schemas/Bill'}}}}
  /internal/v1/wallet-postings/withdrawals/reverse:
    post:
      summary: Add an immutable reversal after a failed bank payout
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawalReversalRequest'}}}}
      responses:
        '200': {description: Reversed, content: {application/json: {schema: {$ref: '#/components/schemas/Bill'}}}}
  /internal/v1/wallet-postings/payments:
    post:
      summary: Post a successful wallet-balance payment
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentPostingRequest'}}}}
      responses:
        '201': {description: Posted, content: {application/json: {schema: {$ref: '#/components/schemas/Bill'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /internal/v1/wallet-postings/refunds:
    post:
      summary: Credit one idempotent full refund using an immutable reversing transaction
      security: [{minipayOAuth: [wallet.posting.write]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundPostingRequest'}}}}
      responses:
        '201': {description: Posted, content: {application/json: {schema: {$ref: '#/components/schemas/Bill'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /internal/v1/tcc/debits/try:
    post:
      summary: Freeze a payer amount with empty-rollback and anti-hanging fences
      security: [{minipayOAuth: [wallet.tcc]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/TxXid'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TryBranchRequest'}}}}
      responses:
        '200': {description: Branch result, content: {application/json: {schema: {$ref: '#/components/schemas/BranchResult'}}}}
  /internal/v1/tcc/credits/try:
    post:
      summary: Prepare a receiver credit branch
      security: [{minipayOAuth: [wallet.tcc]}]
      x-minipay-audience: wallet-internal
      parameters: [{$ref: '#/components/parameters/TxXid'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TryBranchRequest'}}}}
      responses:
        '200': {description: Branch result, content: {application/json: {schema: {$ref: '#/components/schemas/BranchResult'}}}}
  /internal/v1/tcc/transfers/outcomes:
    post:
      summary: Read Debit and Credit business branch outcomes without driving phase two
      security: [{minipayOAuth: [wallet.tcc]}]
      x-minipay-audience: wallet-internal
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferOutcomeRequest'}}}}
      responses:
        '200': {description: Branch outcomes, content: {application/json: {schema: {$ref: '#/components/schemas/TransferOutcome'}}}}
  /internal/v1/agent/wallet-summary:
    get:
      operationId: agentGetWalletSummary
      summary: Read authoritative wallet summary for deterministic rendering
      security: [{delegatedBearer: [wallet.agent.summary]}]
      x-minipay-audience: wallet-internal
      x-minipay-purpose: WALLET_QUERY
      responses:
        '200': {description: Wallet summary, content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /internal/v1/agent/wallet-bills:
    get:
      operationId: agentListWalletBills
      summary: Read bounded authoritative current-user bills
      security: [{delegatedBearer: [wallet.agent.bills.read]}]
      x-minipay-audience: wallet-internal
      x-minipay-purpose: BILL_QUERY
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/BusinessType'}
        - {name: source, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Bill page, content: {application/json: {schema: {$ref: '#/components/schemas/BillsPage'}}}}
  /internal/v1/agent/wallet-bill-aggregations:
    get:
      operationId: agentAggregateWalletBills
      summary: Return bounded deterministic aggregates safe for optional model explanation
      security: [{delegatedBearer: [wallet.agent.bills.aggregate]}]
      x-minipay-audience: wallet-internal
      x-minipay-purpose: BILL_ANALYSIS
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/BusinessType'}
        - {name: source, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Authoritative aggregate, content: {application/json: {schema: {$ref: '#/components/schemas/BillAggregation'}}}}
components:
  securitySchemes:
    delegatedBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    minipayOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/oauth2/authorize
          tokenUrl: http://localhost:8081/oauth2/token
          scopes:
            wallet.read: Read the current consumer wallet and bills
            wallet.write: Manage current-consumer bill metadata and tags
            wallet.account.resolve: Resolve wallet account routing
            wallet.posting.write: Create idempotent wallet postings
            wallet.tcc: Execute trusted transfer TCC branches
            ops.portal: Read operations resources
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    From: {name: from, in: query, schema: {type: string, format: date-time}}
    To: {name: to, in: query, schema: {type: string, format: date-time}}
    Direction: {name: direction, in: query, schema: {type: string, enum: [INCOME, EXPENSE]}}
    BusinessType: {name: businessType, in: query, schema: {type: string, enum: [OPENING_GRANT, RECHARGE, WITHDRAWAL, WITHDRAWAL_REVERSAL, TRANSFER, PAYMENT, REFUND, REVERSAL]}}
    BillStatus: {name: status, in: query, schema: {type: string, enum: [PROCESSING, SUCCEEDED, FAILED]}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    TxXid: {name: TX_XID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  schemas:
    Wallet:
      type: object
      additionalProperties: false
      required: [walletId, availableAmountCent, frozenAmountCent, totalAmountCent, currency, status, annualOutflowYear, annualOutflowLimitCent, annualOutflowUsedCent, annualOutflowRemainingCent, sandboxNotice, recentBills]
      properties:
        walletId: {type: string, format: uuid}
        availableAmountCent: {type: integer, minimum: 0}
        frozenAmountCent: {type: integer, minimum: 0}
        totalAmountCent: {type: integer, minimum: 0}
        currency: {type: string, const: CNY}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
        annualOutflowYear: {type: integer, minimum: 2000}
        annualOutflowLimitCent: {type: integer, minimum: 0}
        annualOutflowUsedCent: {type: integer, minimum: 0}
        annualOutflowRemainingCent: {type: integer, minimum: 0}
        sandboxNotice: {type: string}
        recentBills: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/Bill'}}
    Bill:
      type: object
      additionalProperties: false
      required: [billId, businessType, businessNo, direction, amountCent, status, occurredAt]
      properties:
        billId: {type: string, format: uuid}
        businessType: {type: string}
        businessNo: {type: string}
        source: {type: string, nullable: true}
        direction: {type: string, enum: [INCOME, EXPENSE]}
        amountCent: {type: integer, minimum: 1}
        counterpartyDisplay: {type: string}
        counterpartyUserId: {type: string, format: uuid, nullable: true}
        counterpartyProfile: {$ref: '#/components/schemas/CounterpartyProfile'}
        remark: {type: string, maxLength: 50}
        status: {type: string, enum: [PROCESSING, SUCCEEDED, FAILED]}
        balanceAfterCent: {type: integer, minimum: 0}
        failureCode: {type: string}
        occurredAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CounterpartyProfile:
      type: object
      nullable: true
      required: [userId]
      properties:
        userId: {type: string, format: uuid}
        nickname: {type: string, nullable: true}
        avatarUrl: {type: string, format: uri, nullable: true}
        avatarUrlExpiresAt: {type: string, format: date-time, nullable: true}
    RecentTransferCounterpartyPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RecentTransferCounterparty'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    RecentTransferCounterparty:
      type: object
      required: [userId, nickname, lastTransferAt]
      properties:
        userId: {type: string, format: uuid}
        nickname: {type: string}
        avatarUrl: {type: string, format: uri, nullable: true}
        avatarUrlExpiresAt: {type: string, format: date-time, nullable: true}
        lastTransferAt: {type: string, format: date-time}
    TransferRecordPage:
      type: object
      required: [items, page, size, total, months]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Bill'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        months: {type: array, items: {$ref: '#/components/schemas/TransferMonthSummary'}}
    TransferMonthSummary:
      type: object
      required: [month, incomeAmountCent, expenseAmountCent]
      properties:
        month: {type: string, pattern: '^\d{4}-\d{2}$'}
        incomeAmountCent: {type: integer, minimum: 0}
        expenseAmountCent: {type: integer, minimum: 0}
        legalNameMasked: {type: string, nullable: true}
    BillTag:
      type: object
      required: [tagId, name, createdAt]
      properties:
        tagId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 12}
        createdAt: {type: string, format: date-time}
    BillManagement:
      type: object
      required: [categoryCode, tags, includedInStatistics]
      properties:
        categoryCode: {type: string, enum: [TRANSFER, FUNDING, DINING, SHOPPING, TRANSPORT, LIFE_SERVICE, MEDICAL, EDUCATION, ENTERTAINMENT, REFUND, OTHER]}
        tags: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/BillTag'}}
        userNote: {type: string, maxLength: 200, nullable: true}
        includedInStatistics: {type: boolean}
    BillDetail:
      type: object
      required: [bill, management]
      properties:
        bill: {$ref: '#/components/schemas/Bill'}
        management: {$ref: '#/components/schemas/BillManagement'}
    UpdateBillManagement:
      type: object
      additionalProperties: false
      required: [categoryCode, tagIds, includedInStatistics]
      properties:
        categoryCode: {$ref: '#/components/schemas/BillManagement/properties/categoryCode'}
        tagIds: {type: array, maxItems: 5, uniqueItems: true, items: {type: string, format: uuid}}
        userNote: {type: string, maxLength: 200, nullable: true}
        includedInStatistics: {type: boolean}
    BillTagPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BillTag'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    BillsPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Bill'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    CollectionRecordPage:
      type: object
      required: [items, page, size, total, type, period, from, to, summary]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Bill'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        type: {type: string, enum: [ALL, PERSONAL, MERCHANT]}
        period: {type: string, enum: [TODAY, MONTH]}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        summary:
          type: object
          required: [collectionCount, collectionAmountCent, refundCount, refundAmountCent, netAmountCent]
          properties:
            collectionCount: {type: integer, format: int64, minimum: 0}
            collectionAmountCent: {type: integer, format: int64, minimum: 0}
            refundCount: {type: integer, format: int64, minimum: 0}
            refundAmountCent: {type: integer, format: int64, minimum: 0}
            netAmountCent: {type: integer, format: int64}
    BillAggregation:
      type: object
      required: [from, to, incomeAmountCent, expenseAmountCent, groups]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        incomeAmountCent: {type: integer, format: int64, minimum: 0}
        expenseAmountCent: {type: integer, format: int64, minimum: 0}
        groups:
          type: array
          items:
            type: object
            required: [direction, businessType, billCount, totalAmountCent]
            properties:
              direction: {type: string, enum: [INCOME, EXPENSE]}
              businessType: {type: string}
              billCount: {type: integer, format: int64, minimum: 0}
              totalAmountCent: {type: integer, format: int64, minimum: 0}
    OpsAccount:
      type: object
      required: [accountId, accountNo, ownerType, ownerId, currency, accountRole, availableAmountCent, frozenAmountCent, status, updatedAt]
      properties:
        accountId: {type: string, format: uuid}
        accountNo: {type: string}
        ownerType: {type: string, enum: [CONSUMER, SYSTEM]}
        ownerId: {type: string, format: uuid}
        currency: {type: string, const: CNY}
        accountRole: {type: string}
        availableAmountCent: {type: integer, minimum: 0}
        frozenAmountCent: {type: integer, minimum: 0}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
        updatedAt: {type: string, format: date-time}
    LedgerTransaction:
      type: object
      required: [transactionId, transactionNo, businessType, businessNo, debitTotalAmountCent, creditTotalAmountCent, occurredAt]
      properties:
        transactionId: {type: string, format: uuid}
        transactionNo: {type: string}
        businessType: {type: string}
        businessNo: {type: string}
        debitTotalAmountCent: {type: integer, minimum: 1}
        creditTotalAmountCent: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
    LedgerEntry:
      type: object
      required: [entryId, transactionId, accountId, direction, amountCent, createdAt]
      properties:
        entryId: {type: string, format: uuid}
        transactionId: {type: string, format: uuid}
        accountId: {type: string, format: uuid}
        direction: {type: string, enum: [DEBIT, CREDIT]}
        amountCent: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    LedgerPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/LedgerTransaction'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    LedgerDetail:
      type: object
      required: [transaction, entries]
      properties:
        transaction: {$ref: '#/components/schemas/LedgerTransaction'}
        entries: {type: array, minItems: 2, items: {$ref: '#/components/schemas/LedgerEntry'}}
    ResolveAccountRequest:
      type: object
      additionalProperties: false
      required: [ownerId]
      properties: {ownerId: {type: string, format: uuid}}
    ResolvedAccount:
      type: object
      required: [ownerId, accountId, status]
      properties:
        ownerId: {type: string, format: uuid}
        accountId: {type: string, format: uuid}
        status: {type: string, enum: [PROVISIONING, ACTIVE, SUSPENDED]}
    OpeningGrantRequest:
      type: object
      additionalProperties: false
      required: [eventId, userId]
      properties:
        eventId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
    RechargePostingRequest:
      type: object
      additionalProperties: false
      required: [eventId, rechargeId, rechargeNo, userId, amountCent]
      properties:
        eventId: {type: string, format: uuid}
        rechargeId: {type: string, format: uuid}
        rechargeNo: {type: string}
        userId: {type: string, format: uuid}
        amountCent: {type: integer, minimum: 1, maximum: 1000000}
    WithdrawalPostingRequest:
      type: object
      additionalProperties: false
      required: [withdrawalId, withdrawalNo, userId, amountCent]
      properties:
        withdrawalId: {type: string, format: uuid}
        withdrawalNo: {type: string}
        userId: {type: string, format: uuid}
        amountCent: {type: integer, minimum: 1, maximum: 1000000}
    WithdrawalCompletionRequest:
      type: object
      additionalProperties: false
      required: [withdrawalId, withdrawalNo, userId]
      properties:
        withdrawalId: {type: string, format: uuid}
        withdrawalNo: {type: string}
        userId: {type: string, format: uuid}
    WithdrawalReversalRequest:
      allOf:
        - {$ref: '#/components/schemas/WithdrawalPostingRequest'}
        - type: object
          required: [failureCode]
          properties: {failureCode: {type: string}}
    PaymentPostingRequest:
      type: object
      additionalProperties: false
      required: [paymentOrderId, paymentOrderNo, userId, amountCent, subject, annualLimitMode]
      properties:
        paymentOrderId: {type: string, format: uuid}
        paymentOrderNo: {type: string}
        userId: {type: string, format: uuid}
        amountCent: {type: integer, minimum: 1, maximum: 1000000}
        subject: {type: string, maxLength: 256}
        annualLimitMode: {type: string, enum: [LIMITED, EXEMPT_ACTIVE_CARD]}
    RefundPostingRequest:
      type: object
      additionalProperties: false
      required: [refundId, refundNo, userId, amountCent, originalPaymentNo]
      properties:
        refundId: {type: string, format: uuid}
        refundNo: {type: string}
        userId: {type: string, format: uuid}
        amountCent: {type: integer, minimum: 1, maximum: 1000000}
        originalPaymentNo: {type: string}
    TryBranchRequest:
      type: object
      additionalProperties: false
      required: [businessNo, ownerId, accountId, counterpartyOwnerId, amountCent]
      properties:
        businessNo: {type: string}
        ownerId: {type: string, format: uuid}
        accountId: {type: string, format: uuid}
        counterpartyOwnerId: {type: string, format: uuid}
        amountCent: {type: integer, minimum: 1}
        annualLimitMode: {type: string, enum: [LIMITED, EXEMPT_ACTIVE_CARD]}
    TransferOutcomeRequest:
      type: object
      additionalProperties: false
      required: [businessNo, payerAccountId, receiverAccountId]
      properties:
        businessNo: {type: string}
        payerAccountId: {type: string, format: uuid}
        receiverAccountId: {type: string, format: uuid}
    TransferOutcome:
      type: object
      required: [businessNo, debitStatus, creditStatus]
      properties:
        businessNo: {type: string}
        debitStatus: {type: string, enum: [NOT_FOUND, TRY, CONFIRMED, CANCELLED]}
        creditStatus: {type: string, enum: [NOT_FOUND, TRY, CONFIRMED, CANCELLED]}
    BranchResult:
      type: object
      required: [accepted]
      properties: {accepted: {type: boolean}}
    Problem: {$ref: './components/problem-details-v1.yaml#/components/schemas/ProblemDetails'}
  responses:
    Problem: {description: Problem Details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
