openapi: 3.1.0
info:
  title: MiniPay AI Agent API
  version: 1.0.0
  description: |
    Android AI conversations and recoverable Agent runs. Social chat APIs remain under
    /api/v1/agent/conversations and are intentionally outside this generated contract.
    Their Transfer message type supports both direct and group conversations: transferId
    and transferTargetUserId are required, while amount, status, direction, and display text
    are verified or generated by the server from the authenticated Payment transfer.
servers:
  - url: http://localhost:8086
paths:
  /api/v1/agent/ai/conversations:
    post:
      operationId: createAiConversation
      summary: Create an AI conversation
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversationRequest'}
      responses:
        '201':
          description: Created AI conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    get:
      operationId: listAiConversations
      summary: List current-user AI conversations
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Cursor page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    patch:
      operationId: renameAiConversation
      summary: Rename an AI conversation with optimistic locking
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameConversationRequest'}
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteAiConversation
      summary: Delete the current user's AI view
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      responses:
        '204': {description: Deleted or already absent}
  /api/v1/agent/ai/conversations/{conversationId}/messages:
    get:
      operationId: listAiMessages
      summary: List persisted, redacted AI messages
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - {name: beforeSequence, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Message page in chronological order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/conversations/{conversationId}/runs:
    post:
      operationId: createAgentRun
      summary: Persist a user message and create an idempotent Agent run
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Accepted or idempotently replayed run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/runs:
    get:
      operationId: listActiveAgentRuns
      summary: List current-user runs that are actively processing
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: active, in: query, required: true, schema: {type: boolean, const: true}}
      responses:
        '200':
          description: At most three active runs owned by the current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
  /api/v1/agent/ai/runs/{runId}:
    get:
      operationId: getAgentRun
      summary: Get a current-user Agent run
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      summary: Stop generation without undoing committed business facts
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Cancelled or already terminal run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/runs/{runId}/events:
    get:
      operationId: subscribeAgentRunEvents
      summary: Subscribe to persisted, replay-safe run events
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data field is an EventEnvelope JSON object.
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/runs/{runId}/actions:
    post:
      operationId: continueAgentRunWithAction
      summary: Continue a waiting run with a structured Android card action
      description: W1 preparation only. This endpoint never authenticates or executes a payment.
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}
      responses:
        '200': {description: Current run state, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/memory/settings:
    get:
      operationId: getMemorySettings
      summary: Read current-user explicit memory consent settings
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      responses:
        '200': {description: Memory settings, content: {application/json: {schema: {$ref: '#/components/schemas/MemorySetting'}}}}
    put:
      operationId: updateMemorySettings
      summary: Replace current-user memory consent settings
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMemorySettingsRequest'}}}
      responses:
        '200': {description: Updated settings, content: {application/json: {schema: {$ref: '#/components/schemas/MemorySetting'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/memory/items:
    get:
      operationId: listMemoryItems
      summary: List current-user active structured memories
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/MemoryType'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Active memories, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MemoryItem'}}}}}
    post:
      operationId: createMemoryItem
      summary: Save one structured or manually entered custom memory after explicit user consent
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveMemoryRequest'}}}
      responses:
        '201': {description: Created memory, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryItem'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ai/memory/items/{itemId}:
    patch:
      operationId: updateMemoryItem
      summary: Update one current-user memory with optimistic locking
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters: [{name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMemoryRequest'}}}
      responses:
        '200': {description: Updated memory, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryItem'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteMemoryItem
      summary: Soft-delete one current-user memory
      security: [{minipayOAuth: [agent.conversation]}]
      x-minipay-audience: consumer-api
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '204': {description: Deleted}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    minipayOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/oauth2/authorize
          tokenUrl: http://localhost:8081/oauth2/token
          scopes:
            agent.conversation: Manage current-user AI conversations and runs
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: [string, 'null'], maxLength: 128, description: Optional manual title; otherwise the first redacted message generates it}
    RenameConversationRequest:
      type: object
      additionalProperties: false
      required: [title, version]
      properties:
        title: {type: string, minLength: 1, maxLength: 128}
        version: {type: integer, format: int64, minimum: 0}
    Conversation:
      type: object
      required: [id, title, status, version, lastMessageAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        status: {type: string, enum: [ACTIVE]}
        version: {type: integer, format: int64}
        lastMessageAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Conversation'}
        nextCursor: {type: [string, 'null']}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, message, contextVersion]
      properties:
        clientMessageId: {type: string, format: uuid}
        message: {type: string, minLength: 1, maxLength: 1000}
        contextVersion: {type: integer, format: int64, minimum: 0}
    Run:
      type: object
      required: [runId, conversationId, status, eventsUrl, replayed, version, createdAt, updatedAt]
      properties:
        runId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        status:
          type: string
          enum: [RECEIVED, UNDERSTANDING, WAITING_INPUT, EXECUTING_TOOL, WAITING_CONFIRMATION, COMPLETED, FAILED, CANCELLED]
        businessRefType: {type: [string, 'null']}
        businessRefId: {type: [string, 'null']}
        eventsUrl: {type: string}
        replayed: {type: boolean}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Run'}
    Message:
      type: object
      required: [id, role, content, sequenceNo, createdAt]
      properties:
        id: {type: string, format: uuid}
        runId: {type: [string, 'null'], format: uuid}
        role: {type: string, enum: [USER, ASSISTANT, SYSTEM]}
        content: {type: string}
        cardType: {type: [string, 'null']}
        cardVersion: {type: [integer, 'null']}
        cardPayload: {type: [string, 'null'], description: Versioned JSON serialized for the current Android client}
        sequenceNo: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        nextCursor: {type: [integer, 'null'], format: int64}
    EventEnvelope:
      type: object
      required: [id, type, version, conversationId, runId, occurredAt, payload]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        type:
          type: string
          enum: [run.accepted, run.status, message.delta, message.completed, tool.started, tool.completed, choice.card, memory.confirmation, memory.saved, wallet.card, bills.card, transfer.confirmation.card, merchant.card, product.card, cart.card, food.checkout.card, order.card, payment.required, task.result, task.error, security.error, stream.completed]
          description: choice.card may carry agent.contact-selection; bills.card may carry wallet.bill-summary or deterministic wallet.bill-list.
        version: {type: integer, minimum: 1}
        conversationId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        traceId: {type: [string, 'null']}
        payload: {type: object}
    ActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [GET_MENU, UPDATE_CART, PREPARE_CHECKOUT, GET_ORDER, GET_TRANSFER, COMPLETE_NATIVE_TRANSFER, PREPARE_CANCELLATION, PREPARE_REFUND, SELECT_TRANSFER_RECIPIENT, CONFIRM_MEMORY, DISMISS_MEMORY]}
        recipientUserId: {type: [string, 'null'], format: uuid, description: Selected server-issued friend candidate ID}
        candidateId: {type: [string, 'null'], format: uuid, description: Server-issued short-lived memory candidate ID}
        merchantId: {type: [string, 'null'], format: uuid}
        skuId: {type: [string, 'null'], format: uuid}
        quantity: {type: [integer, 'null'], minimum: 0, maximum: 99}
        optionIds: {type: [array, 'null'], items: {type: string, format: uuid}}
        expectedCartVersion: {type: [integer, 'null'], format: int64, minimum: 0}
        addressId: {type: [string, 'null'], format: uuid}
        orderId: {type: [string, 'null'], format: uuid}
        transferId: {type: [string, 'null'], format: uuid}
    MemoryType:
      type: string
      enum: [FOOD_PREFERENCE, ALLERGEN_AVOIDANCE, MEAL_BUDGET, CONTACT_ALIAS, ADDRESS_ALIAS, CUSTOM]
    MemorySetting:
      type: object
      required: [userId, enabled, foodPreferenceEnabled, allergenAvoidanceEnabled, mealBudgetEnabled, contactAliasEnabled, addressAliasEnabled, version, createdAt, updatedAt]
      properties:
        userId: {type: string, format: uuid}
        enabled: {type: boolean}
        foodPreferenceEnabled: {type: boolean}
        allergenAvoidanceEnabled: {type: boolean}
        mealBudgetEnabled: {type: boolean}
        contactAliasEnabled: {type: boolean}
        addressAliasEnabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateMemorySettingsRequest:
      type: object
      additionalProperties: false
      required: [enabled, foodPreferenceEnabled, allergenAvoidanceEnabled, mealBudgetEnabled, contactAliasEnabled, addressAliasEnabled, version]
      properties:
        enabled: {type: boolean}
        foodPreferenceEnabled: {type: boolean}
        allergenAvoidanceEnabled: {type: boolean}
        mealBudgetEnabled: {type: boolean}
        contactAliasEnabled: {type: boolean}
        addressAliasEnabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    MemoryItem:
      type: object
      required: [id, userId, type, displayValue, status, consentSource, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MemoryType'}
        displayValue: {type: string, maxLength: 256}
        referenceType: {type: [string, 'null'], maxLength: 32}
        referenceId: {type: [string, 'null'], maxLength: 128}
        status: {type: string, enum: [ACTIVE]}
        consentMessageId: {type: [string, 'null'], format: uuid}
        consentSource: {type: string, enum: [PROFILE_MANUAL, CHAT_EXPLICIT]}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SaveMemoryRequest:
      type: object
      additionalProperties: false
      required: [type, displayValue]
      properties:
        type: {$ref: '#/components/schemas/MemoryType'}
        displayValue: {type: string, minLength: 1, maxLength: 256}
        referenceType: {type: [string, 'null'], maxLength: 32}
        referenceId: {type: [string, 'null'], maxLength: 128}
        consentMessageId: {type: [string, 'null'], format: uuid}
    UpdateMemoryRequest:
      type: object
      additionalProperties: false
      required: [displayValue, version]
      properties:
        displayValue: {type: string, minLength: 1, maxLength: 256}
        referenceType: {type: [string, 'null'], maxLength: 32}
        referenceId: {type: [string, 'null'], maxLength: 128}
        consentMessageId: {type: [string, 'null'], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    Problem:
      $ref: './components/problem-details-v1.yaml#/components/schemas/ProblemDetails'
  responses:
    Problem:
      description: RFC 9457 Problem Details with stable code and requestId
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
