apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minipay

# server-lite：在 overlays/server 之上做内存瘦身，用于规格较小的服务器。
# 只改「数字」，不改代码、不改镜像、不改拓扑，出问题去掉本 overlay 即回到 server。
#
# 原理：所有 Java 服务的镜像 ENTRYPOINT 是 exec 形式，硬编码了 -XX:MaxRAMPercentage=75.0，
# 即堆大小 = 容器 memory limit 的 75%。原 limit 是 1Gi（yshop-server 2Gi），
# 意味着 JVM 按 768MB / 1.5GB 规划堆 —— 对低流量部署纯属浪费。
#
# ⚠️ 2026-09-27 实测修正：只下调 limit 并不能把堆压到理想值 —— 75% 依然偏高；
#    而想直接改堆比例时又发现 **JAVA_TOOL_OPTIONS 改不动它**：
#    同时给 JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55 与命令行 -XX:MaxRAMPercentage=75.0，
#    `-XX:+PrintFlagsFinal` 显示生效的是 `{command line}`（JVM 把 JAVA_TOOL_OPTIONS 前置展开，
#    同一 -XX 参数以最后一个为准）。因此 base 里给这 6 个 Java 工作负载显式换成 shell 入口
#    `sh -c 'exec java ${JAVA_OPTS:-...} -jar /app/app.jar'`，堆比例由下面的 JAVA_OPTS 决定；
#    JAVA_TOOL_OPTIONS 继续承担 metaspace/GC/C1/ExitOnOutOfMemory 那几个非冲突参数。
resources:
  - ../server

patches:
  # 1) 所有工作负载：下调 requests/limits，并把 JVM 调优注入共享 ConfigMap。
  #    JAVA_TOOL_OPTIONS / JAVA_OPTS 都是「非 JVM 容器（nginx）直接忽略」的变量。
  #    JAVA_OPTS 只有在 base 里改成 shell 入口的那 6 个 Java 服务上才会被展开。
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: "1", memory: 400Mi}
  - target: {kind: ConfigMap, name: minipay-runtime}
    patch: |-
      - op: add
        path: /data/JAVA_TOOL_OPTIONS
        value: "-XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      # 堆 55%（400Mi limit → 上限约 220MiB，初始 60MiB），实测把 6 个 Java 服务的
      # RSS 从 170~320MiB 压到 150~250MiB，同时不再是「75% 顶格」的换页来源。
      - op: add
        path: /data/JAVA_OPTS
        value: "-XX:MaxRAMPercentage=55 -XX:InitialRAMPercentage=15"
  # 2) yshop-server 框架较重，给稍宽的额度（仍远低于原来的 2Gi）
  - target: {kind: Deployment, name: yshop-server}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 200m, memory: 384Mi}
          limits: {cpu: "1", memory: 768Mi}
  # 3) 关键：禁止滚动更新时「多起一个 Pod」。
  #
  #    这是实测踩出来的坑：K8s 默认 maxSurge=25%，对单副本 Deployment 就等于
  #    「先起新 Pod、再停旧 Pod」，而 9 个 Java 服务的实际 RSS 合计约 2.1 GB。
  #    本机只有 3723 MiB，瞬时需求直接翻倍 → 节点疯狂换页（load average 冲到 23）、
  #    API server 无响应、旧 Pod 卡住不退出，反而又多占 760 MB，形成死锁。
  #
  #    把 maxSurge 压到 0、maxUnavailable 放到 1，滚动更新变成「先停旧、再起新」。
  #    代价是每个服务有几十秒不可用（单副本本来也没有冗余），
  #    换来的是更新过程中内存峰值不再翻倍。
  #
  #    用 op: add 而不是 replace —— base 渲染出来的清单里通常没有 spec.strategy 字段，
  #    replace 会因为路径不存在而失败；add 对「不存在则创建、存在则覆盖」都成立。
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1