apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minipay

resources:
  - ../../base
  - gateway.yaml
  # 这里不再包含 cluster-issuer.yaml 与 certificate.yaml。
  # 原因：那两个文件依赖 cert-manager 的 CRD（ClusterIssuer / Certificate），而本
  # 服务器走的是 Cloudflare Origin CA 路线 —— Cloudflare 已经代理了全部流量
  # （SSL 模式 strict），Origin CA 证书正是为这种拓扑签发的，且长期有效；
  # 而 cert-manager 会额外常驻约 200 MiB 内存（这台机器只有 3723 MiB，
  # 中间件 + 9 个 Java 服务后已非常紧张），收益不成比例。
  # TLS 物料来自 Secret minipay-wildcard-tls，由 scripts/k3s/install-origin-tls.sh
  # 从 Cloudflare Origin CA 的证书/私钥文件生成；该 Secret 不进 Git。

components:
  - private/digests

configMapGenerator:
  - name: minipay-environment
    envs: [runtime.env]

secretGenerator:
  - {name: identity-runtime, envs: [private/identity.env]}
  - name: identity-jwt
    files: [jwt-private.pem=private/jwt-private.pem, jwt-public.pem=private/jwt-public.pem]
  - {name: wallet-runtime, envs: [private/wallet.env]}
  - {name: payment-runtime, envs: [private/payment.env]}
  - {name: commerce-runtime, envs: [private/commerce.env]}
  - {name: agent-runtime, envs: [private/agent.env]}
  - {name: consumer-bff-runtime, envs: [private/consumer-bff.env]}
  # 米灵（ai-agent-scaffold-lite 脚手架）的运行时密钥：
  # 至少包含 REDIS 口令与 MILING_MODEL_API_KEY，不进 Git（与其它 private/*.env 同）。
  - {name: miling-runtime, envs: [private/miling.env]}
  - {name: management-bff-runtime, envs: [private/management-bff.env]}
  - {name: admin-bff-runtime, envs: [private/admin-bff.env]}
  - {name: yshop-runtime, envs: [private/yshop.env]}

patches:
  # Cloudflare 的 HTTP/2 回源曾出现：源站 access log 已返回 200，但边缘仍在
  # 约 60 秒后给浏览器返回 520/525。服务器只有单副本 NGF 数据面；让源站
  # 不再通过 ALPN 宣告 HTTP/2 后，Cloudflare 会自动回落到 HTTP/1.1，
  # 浏览器到 Cloudflare 的 HTTP/2/HTTP/3 不受影响。
  # 回滚：删除此 patch（NginxProxy 的 disableHTTP2 默认是 false）。
  - target: {group: gateway.nginx.org, version: v1alpha2, kind: NginxProxy, name: minipay-gateway-proxy}
    patch: |-
      - {op: add, path: /spec/disableHTTP2, value: true}
  # ---------------------------------------------------------------------------
  # 外卖栈暂时下线（**变更 #47/#48**）：节点内存只有 3.7 GiB，yshop-server 单进程约 600 MiB。
  # 关掉后 food./food-admin. 由 maintenance-page 顶一张「维护中」说明页（不再 503）。
  #
  # ⚠️ 恢复外卖时请删除下面三个 patch，并把工作负载拉回 1 副本：
  #     kubectl -n minipay scale deploy yshop-server yshop-food-h5 yshop-admin-web --replicas=1
  #     （同时把 base/routes/yshop-routes.yaml 的 `/` 规则 backendRefs 改回
  #       yshop-food-h5 / yshop-admin-web）
  - target: {kind: Deployment, name: yshop-server}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 0}
  - target: {kind: Deployment, name: yshop-food-h5}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 0}
  - target: {kind: Deployment, name: yshop-admin-web}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 0}
  # ---------------------------------------------------------------------------
  # C 端从 Android App 换成消费者 H5，同时收敛内存占用。
  # 节点只有 3723 MiB，米灵换成脚手架新服务后要给它留出空间，所以把只为
  # App / 外卖存在的工作负载停掉。
  #
  # commerce-service（request 384Mi / limit 1Gi）：点餐外卖后端。外卖栈
  # （yshop-server / yshop-food-h5 / yshop-admin-web）已经在上面的 patch 里缩到 0、
  # food. 走维护页，H5 的 P0 范围也不含外卖 → 停掉它不影响任何在线功能。
  # 恢复：删掉这个 patch，并
  #   kubectl -n minipay scale deploy commerce-service --replicas=1
  - target: {kind: Deployment, name: commerce-service}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 0}
  #
  # agent-service（request 512Mi / limit 1280Mi）：原来的米灵实现，被
  # miling-service 取代。
  # ⚠️ 这条 patch 一 apply 就会立刻缩到 0（清单是"一次切换到位"的，不是分两步）。
  #    想更保守：第一次 apply 前先注释掉这条，验证 H5 的米灵对话可用后再放开重跑。
  #    今天 agent-service 的唯一消费者就是即将下线的 Android App，所以直接切换也是安全的。
  # 恢复：删掉这个 patch，并
  #   kubectl -n minipay scale deploy agent-service --replicas=1
  - target: {kind: Deployment, name: agent-service}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 0}
  # ---------------------------------------------------------------------------
  # 这里删掉了原先给所有 Deployment 注入 imagePullSecrets: dockerhub-pull 的 patch。
  # 原因：docker.io/suqihang/* 这 14 个镜像仓库是公开的，服务器上匿名拉取已实测成功
  # （digest 与 deploy/k3s/generated/image-digests.json 完全一致）。
  # 而 imagePullSecrets 指向一个不存在的 Secret 只会产生 warning，拉取仍按匿名进行；
  # 但若为了让 warning 消失而塞进一个凭证错误的 Secret，kubelet 会带着错误的
  # Authorization 去拉取公开镜像并收到 401，反而把能跑的环境弄坏。所以这里保持不注入。
  # 如果以后把镜像仓库改成私有，请在本文件恢复下面的 patch，并执行：
  #   kubectl -n minipay create secret docker-registry dockerhub-pull \
  #     --docker-server=docker.io --docker-username=<user> --docker-password=<token>
  - target: {kind: Deployment, name: consumer-bff}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: __Host-minipay-consumer}
  - target: {kind: Deployment, name: management-bff}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: __Host-minipay-management}
  - target: {kind: Deployment, name: admin-bff}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: __Host-minipay-admin}
  - target: {kind: HTTPRoute, name: identity-public}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: identity.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: payment-public}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: payment.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: wallet-public}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: wallet.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: agent-public}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: agent.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: commerce-public}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: commerce.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: merchant-web}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: merchant.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: ops-web}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: ops.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: admin-web}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: admin.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  # 消费者 H5 的入口：app.su46proj.site（取代原来的 APK 下载页面）。
  # 通配证书 *.su46proj.site 已覆盖，只需 DNS 有这条记录。
  - target: {kind: HTTPRoute, name: consumer-web}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: app.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: yshop-food}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: food.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  - target: {kind: HTTPRoute, name: yshop-admin}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: food-admin.su46proj.site}
      - {op: replace, path: /spec/parentRefs/0/sectionName, value: https}
  # ---------------------------------------------------------------------------
  # 让 BFF 的 OAuth2 authorize 走「同主机」路径。
  # （变更 #5 在本地验证过；变更 #34 在服务器实施；此处把它固化进清单，
  #   否则重新 apply 会把 kubectl set env 打的那份冲掉。）
  #
  # 为什么必须这么做：identity 的会话 cookie 建立在「发起登录的那个主机」上
  # （登录走同源反代 /identity/**）。若 BFF 把浏览器重定向到 identity 主机上的
  # /oauth2/authorize，就是跨主机 → cookie 不发送 → 身份服务判定未登录 →
  # 又弹回登录页。这就是「登录后要不跳别处、要不回到登录页」的根因。
  #
  # minipay-web-routes.yaml 里 ops / admin 主机本来就有 /identity 前缀反代到
  # identity-service（带 URLRewrite 剥前缀），所以只要把 authorize 拉回同主机，
  # 既不用放宽 cookie 作用域，也不用重建镜像。
  #
  # 用 op: add + path 以 /- 结尾（追加到 env 数组），避免依赖容器名与数组下标。
  - target: {kind: Deployment, name: management-bff}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_MINIPAY_IDENTITY_AUTHORIZATION_URI
          value: https://ops.su46proj.site/oauth2/authorize
  - target: {kind: Deployment, name: admin-bff}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_MINIPAY_IDENTITY_AUTHORIZATION_URI
          value: https://admin.su46proj.site/oauth2/authorize
  # ---------------------------------------------------------------------------
  # 登出也必须同主机 —— 与 authorize 完全同一类问题。
  #
  # management-bff 的 IdentityLogoutSuccessHandler 拼的是
  #   identityPublicUrl + "/session/logout?target=ops"
  # 而 identityPublicUrl 来自 IDENTITY_PUBLIC_URL = https://identity.su46proj.site。
  # 但登录后会话 cookie 是落在 ops 主机上的（登录走同源反代 /identity/**），
  # 把浏览器送去 identity 主机 → 跨主机 → cookie 不发送 → identity 看不到会话、
  # 清不掉 → 表现为「点了退出但没退出」。
  #
  # minipay.identity-public-url 在这个 BFF 里是「面向浏览器」的那一个
  # （服务端互调用的是 minipay.identity-internal-url），所以覆盖它是安全的。
  - target: {kind: Deployment, name: management-bff}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MINIPAY_IDENTITY_PUBLIC_URL
          value: https://ops.su46proj.site/identity
  - target: {kind: Deployment, name: admin-bff}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MINIPAY_IDENTITY_PUBLIC_URL
          value: https://admin.su46proj.site/identity
  # ---------------------------------------------------------------------------
  # 镜像引用已回到 **digest 锁定**（**2026-09-27 收尾**）。
  #
  # 背景：变更 #44/#45 起，三个控制台前端 + 消费者 H5 + 米灵 + consumer-bff/identity
  # 一直用「tag + IfNotPresent」顶着，原因就是新镜像推不上 Docker Hub，
  # 节点镜像源拿不到这些 digest → 用 digest 引用会 ImagePullBackOff。
  #
  # 现在四颗新镜像都已发布到 Docker Hub（digest 见 deploy/k3s/README.md 的表格、
  # generated/image-digests.json 与 private/digests 组件），并且**实测 kubelet 能
  # 通过节点配置的国内镜像源按 digest 拉取**：一次性 pod 引用
  # `suqihang/consumer-web@sha256:850509e3…` 在 1.078s 内拉完 21 MB ✓。
  # 所以这里删掉全部 tag/IfNotPresent patch，统一由 private/digests 组件锁定。
  #
  # 回退办法：把对应 patch 加回来即可（只改 tag 两行），节点本地已有 tag 镜像，
  # `IfNotPresent` 不会再拉取。
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 演示环境开启实名认证沙箱通道（**变更 #53**）。
  #
  # base/config/runtime-config.yaml 里 REAL_NAME_PROVIDER=disabled，于是
  # POST /api/v1/real-name-verifications 直接 503 REAL_NAME_PROVIDER_UNAVAILABLE，
  # App 的实名认证整条流程走不下去（用户实测反馈）。
  # 演示环境没有阿里云实名认证凭证，用 sandbox：证件尾号非 0 即通过，
  # 与「固定短信验证码 123456」的演示策略一致。
  #
  # ⚠️ 正式环境：改回 disabled，或配置 aliyun + minipay.identity.real-name.*
  #    的 AK/SK（见 services/identity-service/.../AliyunRealNameVerification.java）。
  - target: {kind: Deployment, name: identity-service}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REAL_NAME_PROVIDER
          value: "sandbox"
  # ---------------------------------------------------------------------------
  # 米灵（AI 助手）接模型（**变更 #55**）。
  #
  # agent-service 默认 MODEL_ENABLED=false / MODEL_CHAT_MODE=none → 走 UnavailableModelGateway，
  # 对话 run 直接 FAILED（App 里表现为「AI 不回话」）。演示环境接的是智谱 GLM 的
  # OpenAI 兼容接口（Spring AI 的 openai 模式：base-url + /chat/completions）。
  #
  # ⚠️ API Key 不进 Git：由 overlays/server/private/agent.env 注入 agent-runtime Secret
  #    的 MODEL_API_KEY（kustomize secretGenerator）。换模型只改 MODEL_NAME；
  #    换供应商改 MODEL_BASE_URL（任何 OpenAI 兼容服务都可以）。
  - target: {kind: Deployment, name: agent-service}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_CHAT_MODE
          value: openai
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_BASE_URL
          value: https://open.bigmodel.cn/api/paas/v4
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_NAME
          value: glm-4.5-air
  # ---------------------------------------------------------------------------
  # 关掉 identity-service 的邮件健康指示器（**变更 #38**）。
  #
  # 现象：`GET /actuator/health` 返回 503，{status:DOWN}，而 liveness/readiness 都是 UP，
  #       BFF 探活汇总后前端一直挂着「部分服务暂不可用」。
  # 证据（临时打开 show-details 拿到的原始 JSON）：
  #   "mail":{"status":"DOWN","details":{"location":":465",
  #           "error":"jakarta.mail.AuthenticationFailedException: failed to connect, no password specified?"}}
  #   db / redis / rabbit / diskSpace / ssl / ping 全部 UP。
  #
  # 根因：application.yml 里写的是 `spring.mail.host: ${EMAIL_SMTP_HOST:}`。
  #       Spring Boot 的 MailSenderAutoConfiguration 条件是「该属性**存在**」而不是「非空」，
  #       于是 host="" 也照样装配出 JavaMailSender，并连带注册 MailHealthIndicator →
  #       连不上 SMTP（也没配口令）→ DOWN → 整个 aggregate 变 DOWN。
  #       application.yml 那句注释「host 为空时 Spring Boot 不装配 JavaMailSender」与事实不符。
  #
  # 为什么用配置而不是改代码：本环境 `EMAIL_PROVIDER=disabled`，邮件通道本来就没启用，
  #       让一个「可选通道」把整体健康度拉黑没有意义；这个 env 只影响健康指示器，
  #       不影响任何业务接口，且不用重建镜像、随时可回滚。
  - target: {kind: Deployment, name: identity-service}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_HEALTH_MAIL_ENABLED
          value: "false"
