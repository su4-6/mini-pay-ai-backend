apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: minipay-gateway
  namespace: minipay
spec:
  gatewayClassName: nginx
  # 把 NginxProxy 挂到本 Gateway（变更 #48）：数据面的 resources 由此声明，
  # NGF 每次 reconcile 都会按它渲染，避免网关与业务争内存（变更 #46 的根因之一）。
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: minipay-gateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: {namespaces: {from: Same}}
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: minipay-wildcard-tls}]
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: minipay-http-redirect, namespace: minipay}
spec:
  parentRefs: [{name: minipay-gateway, sectionName: http}]
  hostnames: ["*.su46proj.site"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
