apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-bff
  namespace: minipay
  labels: &labels
    app.kubernetes.io/name: consumer-bff
    app.kubernetes.io/part-of: minipay
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: consumer-bff}}
  template:
    metadata: {labels: *labels}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: consumer-bff
          image: suqihang/consumer-bff:0.1.0-k3s.4
          imagePullPolicy: IfNotPresent
          # exec 形式的 ENTRYPOINT 固定了 -XX:MaxRAMPercentage=75.0，JAVA_OPTS 不会被展开
          # （实测：同时给 JAVA_TOOL_OPTIONS=55 与命令行 75 时生效的是命令行）。
          # 因此显式改用 shell 入口，把堆比例交给 minipay-runtime 的 JAVA_OPTS（见 overlays/server-lite）。
          command: ["sh", "-c", "exec java ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0} -jar /app/app.jar"]
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          env:
            - {name: SPRING_SESSION_COOKIE_NAME, value: minipay-consumer-local}
          envFrom:
            - configMapRef: {name: minipay-runtime}
            - configMapRef: {name: minipay-environment}
            - secretRef: {name: consumer-bff-runtime}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 15, failureThreshold: 3}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-bff
  namespace: minipay
  labels:
    app.kubernetes.io/name: consumer-bff
    app.kubernetes.io/part-of: minipay
spec: {type: ClusterIP, selector: {app.kubernetes.io/name: consumer-bff}, ports: [{name: http, port: 8080, targetPort: http}]}
