apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: minipay
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: minipay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: minipay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: suqihang/identity-service:0.1.0-k3s.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: minipay-environment
                  key: IDENTITY_MYSQL_URL
            # ------------------------------------------------------------------
            # 固定短信验证码 123456（演示/验收用，本地与服务器一致）。
            #
            # 必须同时满足两个条件 DemoSmsSender 才会生效：
            #   @Profile("demo-auth")                        -> 下面第 1 项
            #   minipay.identity.sms.provider == "demo"       -> 下面第 2 项
            # 只设 SMS_PROVIDER=demo 是不够的，profile 也必须带上，否则仍然报
            # “短信服务暂不可用”。
            #
            # ⚠️ 安全警告（务必知悉）：
            #   固定验证码意味着**任何人只要知道手机号就能登录任意账号**，
            #   等同于鉴权旁路。因此：
            #     - 仅适用于演示/内部验收环境；
            #     - 服务器上必须做访问控制（安全组/白名单/内网），不要对公网开放；
            #     - 接入真实用户前必须改用真实短信通道：
            #       SMS_PROVIDER 可选 aliyun / dypns / webhook / console。
            #
            # 说明：demo-auth profile 还会把 classpath:db/demo 加入 Flyway 位置，
            #   全新数据库会自动创建演示平台管理员与演示商户账号（本地库已应用过，不会重跑）。
            # ------------------------------------------------------------------
            - name: SPRING_PROFILES_ACTIVE
              value: k3s,demo-auth
            - name: SMS_PROVIDER
              value: demo
            - name: DEMO_SMS_CODE
              value: "123456"
          envFrom:
            - configMapRef:
                name: minipay-runtime
            - configMapRef:
                name: minipay-environment
            - secretRef:
                name: identity-runtime
          volumeMounts:
            - name: jwt-signing-keys
              mountPath: /var/run/secrets/minipay
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: jwt-signing-keys
          secret:
            secretName: identity-jwt
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: minipay
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: minipay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
