apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-web
  namespace: minipay
  labels: &labels
    app.kubernetes.io/name: consumer-web
    app.kubernetes.io/part-of: minipay
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: consumer-web}}
  template:
    metadata: {labels: *labels}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: consumer-web
          # 消费者 H5（取代 Android App 的线上 C 端）。首次发布用 tag + IfNotPresent
          # 配合 `k3s ctr images import`（与三个 Web 前端同样的处理）；
          # 等 Docker Hub 能推之后再补进 overlays/server/private/digests。
          image: suqihang/consumer-web:0.1.0-k3s.2
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 12, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: cache, mountPath: /var/cache/nginx}, {name: run, mountPath: /var/run}]
      volumes: [{name: cache, emptyDir: {sizeLimit: 32Mi}}, {name: run, emptyDir: {sizeLimit: 8Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-web
  namespace: minipay
  labels:
    app.kubernetes.io/name: consumer-web
    app.kubernetes.io/part-of: minipay
spec: {type: ClusterIP, selector: {app.kubernetes.io/name: consumer-web}, ports: [{name: http, port: 80, targetPort: http}]}
