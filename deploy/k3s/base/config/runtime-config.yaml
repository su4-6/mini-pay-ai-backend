apiVersion: v1
kind: ConfigMap
metadata:
  name: minipay-runtime
  namespace: minipay
data:
  SERVER_PORT: "8080"
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SPRING_PROFILES_ACTIVE: k3s
  JWT_SIGNING_PRIVATE_KEY_LOCATION: file:/var/run/secrets/minipay/jwt-private.pem
  JWT_SIGNING_PUBLIC_KEY_LOCATION: file:/var/run/secrets/minipay/jwt-public.pem
  IDENTITY_INTERNAL_URL: http://identity-service:8080
  IDENTITY_JWK_SET_URI: http://identity-service:8080/oauth2/jwks
  IDENTITY_TOKEN_URL: http://identity-service:8080/oauth2/token
  PAYMENT_INTERNAL_URL: http://payment-service:8080
  WALLET_INTERNAL_URL: http://wallet-service:8080
  AGENT_INTERNAL_URL: http://agent-service:8080
  COMMERCE_INTERNAL_URL: http://commerce-service:8080
  MINIPAY_COMMERCE_INTERNAL_URL: http://commerce-service:8080
  YSHOP_INTERNAL_URL: http://yshop-server:48080
  SMS_PROVIDER: disabled
  EMAIL_PROVIDER: disabled
  REAL_NAME_PROVIDER: disabled
  OBJECT_STORAGE_PROVIDER: disabled
  CONTENT_SAFETY_PROVIDER: disabled
  MODEL_CHAT_MODE: none
  MODEL_ENABLED: "false"
  MINIPAY_FOOD_PROVIDER: yshop
  # 自研管理端 admin-web（admin.<domain>）要求 system_super_admin / system_account_admin
  # 角色才能进入。
  #
  # ⚠️ 不要在这里设置 BOOTSTRAP_SYSTEM_ADMIN_MOBILE：
  # identity-service 的 SystemAdminBootstrap 在「该手机号已被现有账号绑定」时
  # 会直接抛 IllegalStateException("Bootstrap administrator mobile is already bound")
  # 导致**启动失败、CrashLoopBackOff**（已实测踩到）。
  # 而且它创建的是 credential_type='SMS' 的新账号，在 SMS_PROVIDER=disabled 下无法登录。
  #
  # 正确做法：给已有的、已有密码的管理员账号直接授予系统角色，
  # 见 scripts/k3s/sql/grant-system-admin.sql。
  # 正式环境首次部署时可用该引导（指向一个未被占用的手机号），先在本地把该账号的
  # 登录密码设置好，再进入 admin-web。
  # 外卖订单结算所用的平台商户应用（payment-service 的 FoodPaymentSagaService 在为空时
  # 会直接抛 IllegalStateException("FOOD_PLATFORM_MERCHANT_APP_ID is not configured")，
  # 导致“外卖下单 -> 支付”整条链路不可用）。
  # 取值必须对应 payment 库中同时满足 merchant.status=ACTIVE、
  # merchant_application.status=ACTIVE、available_channels 含 WALLET 的 app_id。
  # 这里沿用 compose.yaml 的演示默认值（星河便利店 M202608030001）；
  # 正式环境必须覆盖为真实平台商户 app_id。
  FOOD_PLATFORM_MERCHANT_APP_ID: app_demo_starry
