apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: yshop-food, namespace: minipay}
spec:
  parentRefs: [{name: minipay-gateway, sectionName: http}]
  hostnames: [food.minipay.localhost]
  rules:
    - matches: [{path: {type: PathPrefix, value: /app-api}}]
      backendRefs: [{name: yshop-server, port: 48080}]
    # 外卖 H5 暂时下线（变更 #47）：页面路由指向维护页，避免直接 503。
    # 恢复：把 backendRefs 改回 {name: yshop-food-h5, port: 80}，
    # 并把 deployment/yshop-food-h5、yshop-server、yshop-admin-web 拉回 1 副本。
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: maintenance-page, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: yshop-admin, namespace: minipay}
spec:
  parentRefs: [{name: minipay-gateway, sectionName: http}]
  hostnames: [food-admin.minipay.localhost]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /admin-api}}
      backendRefs: [{name: yshop-server, port: 48080}]
    # 同上：外卖后台页面也先顶维护页
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: maintenance-page, port: 80}]
