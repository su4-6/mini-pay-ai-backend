apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: identity-public, namespace: minipay}
spec:
  parentRefs: [{name: minipay-gateway, sectionName: http}]
  hostnames: [identity.minipay.localhost]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /api/v1}}
        - {path: {type: PathPrefix, value: /oauth2}}
        - {path: {type: PathPrefix, value: /login}}
        - {path: {type: PathPrefix, value: /userinfo}}
        - {path: {type: PathPrefix, value: /session/logout}}
      backendRefs: [{name: identity-service, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: payment-public, namespace: minipay}
spec:
  parentRefs: [{name: minipay-gateway, sectionName: http}]
  hostnames: [payment.minipay.localhost]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/v1}}, {path: {type: PathPrefix, value: /openapi/v1}}]
      backendRefs: [{name: payment-service, port: 8080}]
---
