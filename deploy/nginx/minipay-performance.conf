# MiniPay public delivery tuning. Load this file in the nginx http context.
# Shop images are validated at 5 MiB by the application. Allow enough room for
# request headers while keeping a conservative gateway limit.
client_max_body_size 6m;
client_body_buffer_size 128k;
client_body_timeout 30s;

gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/problem+json
    application/xml
    image/svg+xml;

keepalive_timeout 65;
keepalive_requests 1000;
sendfile_max_chunk 2m;
tcp_nodelay on;

open_file_cache max=10000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;
