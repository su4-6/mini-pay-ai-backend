openapi: 3.1.0
info:
  title: MiniPay OPS Authentication API
  version: 1.0.0
paths:
  /api/v1/auth/captchas:
    post:
      summary: Create a one-time image captcha
      responses:
        "200":
          description: Captcha created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaChallengeResponse"
  /api/v1/auth/sms-challenges:
    post:
      summary: Send an OPS login SMS challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, captchaId, captchaCode]
              properties:
                phone: { type: string, pattern: "^1[3-9][0-9]{9}$" }
                captchaId: { type: string, format: uuid }
                captchaCode: { type: string, minLength: 4, maxLength: 4 }
      responses:
        "200":
          description: Challenge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsChallengeResponse"
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    get:
      summary: Read the Management BFF session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/csrf:
    get:
      summary: Read CSRF form metadata
      responses:
        "200":
          description: CSRF metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
  /api/v1/login-audits:
    get:
      summary: List login audits through the Management BFF
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Audit page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginAuditPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    AuthenticatedAdmin:
      type: object
      required: [userId, displayName, roles, permissions]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [platform_admin] }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [ops.portal, ops.audit.read] }
    SessionResponse:
      type: object
      required: [authenticated, loginUrl]
      properties:
        authenticated: { type: boolean }
        loginUrl: { type: string }
        admin:
          oneOf:
            - $ref: "#/components/schemas/AuthenticatedAdmin"
            - { type: "null" }
    CsrfResponse:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: { type: string }
        parameterName: { type: string }
        token: { type: string, writeOnly: true }
    CaptchaChallengeResponse:
      type: object
      required: [captchaId, imageUrl, expiresAt]
      properties:
        captchaId: { type: string, format: uuid }
        imageUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    SmsChallengeResponse:
      type: object
      required: [challengeId, maskedPhone, expiresAt, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        maskedPhone: { type: string, example: "138****8000" }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer }
        demoCode:
          type: [string, "null"]
          description: Present only in the explicit local demo-auth profile.
    LoginAuditItem:
      type: object
      required: [auditId, occurredAt, authenticationMethod, result, requestId]
      properties:
        auditId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        authenticationMethod: { type: string, enum: [PASSWORD, SMS] }
        result: { type: string, enum: [SUCCESS, REJECTED, LOCKED, DISABLED, ROLE_DENIED] }
        displayName: { type: [string, "null"] }
        requestId: { type: string }
    LoginAuditPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoginAuditItem"
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ProblemDetails:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        requestId: { type: string }
        detail: { type: string }
